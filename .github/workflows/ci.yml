name: CI

on:
  push:
  pull_request:

jobs:
  preview-static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate preview data
        run: node scripts/validate-preview-data.mjs

